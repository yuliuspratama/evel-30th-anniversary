<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustrasi dua tangan yang berpegangan erat">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6ecec"/>
      <stop offset="100%" stop-color="#e4cfd0"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2ddcc"/>
      <stop offset="100%" stop-color="#e0bfa9"/>
    </linearGradient>
    <linearGradient id="sleeve2L" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a1f2b"/>
      <stop offset="100%" stop-color="#6b1a25"/>
    </linearGradient>
    <linearGradient id="sleeve2R" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c1420"/>
      <stop offset="100%" stop-color="#4a0f1a"/>
    </linearGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bg2)"/>
  <circle cx="320" cy="240" r="170" fill="url(#halo2)"/>

  <!-- lengan kiri (dari kiri bawah) -->
  <path d="M90 480 L90 300 Q150 250 230 262 L300 300 L300 360 L230 330 Q170 330 150 360 L150 480 Z"
        fill="url(#sleeve2L)"/>
  <path d="M150 360 L150 480 L170 480 L170 370 Q180 348 230 340"
        stroke="#5a141f" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- lengan kanan (dari kanan bawah) -->
  <path d="M550 480 L550 300 Q490 250 410 262 L340 300 L340 360 L410 330 Q470 330 490 360 L490 480 Z"
        fill="url(#sleeve2R)"/>
  <path d="M490 360 L490 480 L470 480 L470 370 Q460 348 410 340"
        stroke="#3d0d16" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- tangan kiri (menjangkau) -->
  <path d="M250 280 Q300 250 322 292 L322 340 Q300 352 280 348 Q255 335 250 310 Z"
        fill="url(#skin2)" filter="url(#soft2)"/>

  <!-- tangan kanan (menjangkau) -->
  <path d="M390 280 Q340 250 318 292 L318 340 Q340 352 360 348 Q385 335 390 310 Z"
        fill="url(#skin2)" filter="url(#soft2)"/>

  <!-- jari yang saling berpelukan -->
  <g stroke="#c99f88" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M278 300 Q320 286 362 300"/>
    <path d="M278 322 Q320 308 362 322"/>
    <path d="M280 344 Q320 332 360 344"/>
  </g>

  <!-- cincin -->
  <circle cx="338" cy="316" r="9" fill="none" stroke="#c39a4e" stroke-width="4.5"/>
  <circle cx="338" cy="316" r="3" fill="#f0d68a"/>

  <!-- bunga melati -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="150" cy="150" r="11"/>
    <circle cx="165" cy="165" r="11"/>
    <circle cx="135" cy="165" r="11"/>
    <circle cx="150" cy="165" r="6" fill="#e9c97a" opacity="0.8"/>
  </g>
  <path d="M150 176 Q145 200 148 240" stroke="#5f7f5a" stroke-width="2.5" fill="none" opacity="0.6"/>
  <g fill="#ffffff" opacity="0.78">
    <circle cx="500" cy="120" r="10"/>
    <circle cx="514" cy="134" r="10"/>
    <circle cx="486" cy="134" r="10"/>
    <circle cx="500" cy="134" r="5" fill="#e9c97a" opacity="0.7"/>
  </g>
  <path d="M500 144 Q505 168 502 208" stroke="#5f7f5a" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
