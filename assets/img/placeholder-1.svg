<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustrasi dua orang berjalan bersama di taman pada sore hari">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbeae6"/>
      <stop offset="55%" stop-color="#f0d5cf"/>
      <stop offset="100%" stop-color="#e2bfb8"/>
    </linearGradient>
    <linearGradient id="ground1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4e0d0"/>
      <stop offset="100%" stop-color="#a8c6a6"/>
    </linearGradient>
    <radialGradient id="sun1" cx="0.78" cy="0.22" r="0.18">
      <stop offset="0%" stop-color="#fff4d8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0c78c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft1" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- langit & matahari -->
  <rect width="640" height="480" fill="url(#sky1)"/>
  <circle cx="500" cy="110" r="120" fill="url(#sun1)"/>
  <circle cx="500" cy="110" r="44" fill="#fff1cf" opacity="0.9"/>

  <!-- tanah -->
  <rect y="330" width="640" height="150" fill="url(#ground1)"/>

  <!-- jalan setapak melengkung -->
  <path d="M200 480 Q320 400 440 480 Z" fill="#d9c7ae" opacity="0.75"/>
  <path d="M210 480 Q320 410 430 480" stroke="#c9b598" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="4 8"/>

  <!-- pohon kiri -->
  <rect x="84" y="250" width="18" height="112" rx="3" fill="#8a6b52"/>
  <circle cx="93" cy="230" r="58" fill="#87ab85"/>
  <circle cx="75" cy="212" r="32" fill="#7a9d79" opacity="0.9"/>
  <circle cx="112" cy="220" r="28" fill="#95b593" opacity="0.85"/>

  <!-- pohon kanan -->
  <rect x="548" y="272" width="14" height="90" rx="3" fill="#8a6b52"/>
  <circle cx="555" cy="256" r="42" fill="#7ea07c"/>
  <circle cx="538" cy="244" r="24" fill="#72966f" opacity="0.85"/>

  <!-- pasangan berjalan, berpegangan tangan -->
  <g filter="url(#soft1)">
    <!-- bayangan -->
    <ellipse cx="320" cy="408" rx="70" ry="8" fill="#000" opacity="0.12"/>
  </g>

  <!-- pasangan kiri -->
  <g>
    <rect x="274" y="328" width="36" height="76" rx="11" fill="#7a1f2b"/>
    <circle cx="292" cy="310" r="19" fill="#f0d9c8"/>
    <path d="M273 304 a19 19 0 0 1 38 0" fill="#ededed"/>
    <rect x="306" y="340" width="13" height="60" rx="6" fill="#7a1f2b"/>
  </g>

  <!-- pasangan kanan -->
  <g>
    <rect x="332" y="332" width="34" height="72" rx="11" fill="#5c1420"/>
    <circle cx="349" cy="314" r="18" fill="#f0d9c8"/>
    <path d="M331 308 a18 18 0 0 1 34 0" fill="#dedede"/>
    <rect x="318" y="342" width="13" height="58" rx="6" fill="#5c1420"/>
  </g>

  <!-- tangan berpegangan -->
  <rect x="306" y="352" width="17" height="9" rx="4" fill="#f0d9c8"/>
  <circle cx="314" cy="356" r="2" fill="#c39a4e" opacity="0.8"/>

  <!-- bunga & rumput -->
  <g opacity="0.85">
    <circle cx="150" cy="402" r="6" fill="#d98a94"/>
    <circle cx="470" cy="420" r="6" fill="#d98a94"/>
    <circle cx="410" cy="386" r="5" fill="#e0a3ab"/>
    <circle cx="128" cy="430" r="4" fill="#e0a3ab"/>
    <circle cx="520" cy="395" r="5" fill="#d98a94"/>
  </g>
  <g stroke="#6f9169" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M148 408 Q146 420 144 432"/>
    <path d="M468 426 Q466 438 464 450"/>
    <path d="M408 392 Q406 404 404 416"/>
  </g>
</svg>
