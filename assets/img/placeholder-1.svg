<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Ilustrasi dua orang berjalan bersama di taman">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e6e2"/>
      <stop offset="100%" stop-color="#e8c9c4"/>
    </linearGradient>
    <linearGradient id="ground1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0cd"/>
      <stop offset="100%" stop-color="#a8c6a6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="url(#sky1)"/>
  <circle cx="500" cy="110" r="52" fill="#f2d9a8" opacity="0.85"/>
  <rect y="330" width="640" height="150" fill="url(#ground1)"/>

  <!-- jalan setapak -->
  <path d="M240 480 Q320 390 400 480 Z" fill="#d9c7ae" opacity="0.7"/>

  <!-- pohon -->
  <rect x="86" y="250" width="16" height="110" fill="#8a6b52"/>
  <circle cx="94" cy="232" r="52" fill="#87ab85"/>
  <rect x="548" y="272" width="13" height="88" fill="#8a6b52"/>
  <circle cx="554" cy="258" r="40" fill="#7ea07c"/>

  <!-- pasangan berjalan, berpegangan tangan -->
  <g>
    <!-- pasangan di kiri -->
    <rect x="276" y="330" width="34" height="74" rx="10" fill="#7a1f2b"/>
    <circle cx="293" cy="312" r="18" fill="#f0d9c8"/>
    <path d="M275 306 a18 18 0 0 1 36 0" fill="#e6e6e6"/>
    <rect x="308" y="342" width="12" height="58" rx="6" fill="#7a1f2b"/>

    <!-- kanan pasangan -->
    <rect x="332" y="334" width="32" height="70" rx="10" fill="#5c1420"/>
    <circle cx="348" cy="316" r="17" fill="#f0d9c8"/>
    <path d="M331 310 a17 17 0 0 1 34 0" fill="#dedede"/>
    <rect x="318" y="344" width="12" height="56" rx="6" fill="#5c1420"/>

    <!-- tangan berpegangan -->
    <rect x="306" y="352" width="16" height="8" rx="4" fill="#f0d9c8"/>
  </g>

  <!-- bunga kecil -->
  <circle cx="150" cy="400" r="5" fill="#d98a94"/>
  <circle cx="470" cy="420" r="5" fill="#d98a94"/>
  <circle cx="410" cy="386" r="4" fill="#e0a3ab"/>
</svg>